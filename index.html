<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratório de Acessibilidade Web (A11y) - Estudo Comparativo WCAG 2.1</title>
    <meta name="description" content="Laboratório didático interativo para ensino de Acessibilidade Web (a11y) e WCAG 2.1 AA em React com TypeScript." />
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- SVG Filters for Daltonism & Low Vision Simulation -->
    <svg style="position: absolute; height: 0; width: 0; overflow: hidden;" aria-hidden="true">
      <defs>
        <!-- Protanopia (Falta de sensibilidade ao vermelho) -->
        <filter id="protanopia">
          <feColorMatrix
            type="matrix"
            values="0.567, 0.433, 0,     0, 0
                    0.558, 0.442, 0,     0, 0
                    0,     0.242, 0.758, 0, 0
                    0,     0,     0,     1, 0"
          />
        </filter>
        <!-- Deuteranopia (Falta de sensibilidade ao verde) -->
        <filter id="deuteranopia">
          <feColorMatrix
            type="matrix"
            values="0.625, 0.375, 0,   0, 0
                    0.700, 0.300, 0,   0, 0
                    0,     0.300, 0.7, 0, 0
                    0,     0,     0,   1, 0"
          />
        </filter>
        <!-- Tritanopia (Falta de sensibilidade ao azul) -->
        <filter id="tritanopia">
          <feColorMatrix
            type="matrix"
            values="0.95, 0.05,  0,     0, 0
                    0,    0.433, 0.567, 0, 0
                    0,    0.475, 0.525, 0, 0
                    0,    0,     0,     1, 0"
          />
        </filter>
        <!-- Acromatopsia (Visão monocromática / escala de cinza total) -->
        <filter id="achromatopsia">
          <feColorMatrix
            type="matrix"
            values="0.299, 0.587, 0.114, 0, 0
                    0.299, 0.587, 0.114, 0, 0
                    0.299, 0.587, 0.114, 0, 0
                    0,     0,     0,     1, 0"
          />
        </filter>
        <!-- Baixa Visão / Visão Embaçada / Catarata -->
        <filter id="low-vision">
          <feGaussianBlur stdDeviation="2.2" />
          <feComponentTransfer>
            <feFuncR type="linear" slope="0.85" />
            <feFuncG type="linear" slope="0.85" />
            <feFuncB type="linear" slope="0.85" />
          </feComponentTransfer>
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
